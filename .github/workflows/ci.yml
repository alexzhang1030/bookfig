name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: packages/bookfig
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint (vite-plus / oxlint)
        run: pnpm exec vp lint
      - name: Typecheck (tsgo)
        run: pnpm exec tsgo --noEmit -p packages/bookfig/tsconfig.json
      - name: Test (vite-plus / vitest)
        run: pnpm exec vp test
